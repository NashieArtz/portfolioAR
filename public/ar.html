<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body, html { margin: 0; overflow: hidden; }

        /* Le CSS reste inchangé pour ton UI (Nav, Tech Panel, etc.) */
        .nav-btn {
            display: none;
            position: fixed;
            bottom: 40px;
            z-index: 200;
            background: #4a0060;
            color: white;
            border: 2px solid #9C27B0;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(156,39,176,0.6);
        }
        #btn-prev { left: calc(50% - 90px); }
        #btn-next { left: calc(50% + 26px); }

        #card-counter {
            display: none;
            position: fixed;
            bottom: 116px;
            left: 50%;
            transform: translateX(-50%);
            color: #CE93D8;
            font-family: monospace;
            font-size: 14px;
            z-index: 200;
            background: rgba(20,0,30,0.7);
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 3px;
        }

        #floating-btn {
            display: none;
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: #4a0060;
            color: white;
            border: 2px solid #9C27B0;
            padding: 16px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(156,39,176,0.5);
            min-width: 220px;
            min-height: 56px;
            font-family: monospace;
            letter-spacing: 1px;
        }

        #tech-panel {
            display: none;
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: #14001e;
            border: 1px solid #9C27B0;
            border-radius: 16px;
            padding: 16px 24px;
            z-index: 300;
            min-width: 280px;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 20px rgba(156,39,176,0.4);
        }
        #tech-panel h3 {
            margin: 0 0 12px 0;
            color: #CE93D8;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #tech-panel .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        #tech-panel .tag {
            background: #2d004a;
            color: #CE93D8;
            border: 1px solid #9C27B0;
            border-radius: 20px;
            padding: 4px 12px;
            font-family: monospace;
            font-size: 12px;
        }
        #tech-panel .close-tech {
            margin-top: 14px;
            display: block;
            color: #9C27B0;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .card-btns {
            display: none;
            position: fixed;
            bottom: 116px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            gap: 12px;
            flex-direction: row;
        }
        .card-btns.visible { display: flex; }
        .card-action-btn {
            background: #2d004a;
            color: #CE93D8;
            border: 1px solid #9C27B0;
            border-radius: 20px;
            padding: 10px 18px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(156,39,176,0.3);

        }
    </style>
</head>
<body>

<button id="floating-btn" onclick="showCards()">◈ Voir mes projets</button>
<button class="nav-btn" id="btn-prev" onclick="prevCard()">‹</button>
<button class="nav-btn" id="btn-next" onclick="nextCard()">›</button>
<div id="card-counter"></div>

<div class="card-btns" id="card-btns">
    <button class="card-action-btn" onclick="openGithub()">⌥ GitHub</button>
    <button class="card-action-btn" onclick="toggleTech()">◈ Stack</button>
</div>

<div id="tech-panel">
    <h3 id="tech-title">Technologies</h3>
    <div class="tags" id="tech-tags"></div>
    <span class="close-tech" onclick="closeTech()">✕ fermer</span>
</div>

<a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>

    <a-assets>
        <img id="img-crm"     src="/projects/proj_crm_1.png">
        <img id="img-web4"    src="/projects/proj_web4_1.png">
        <img id="img-mustcle" src="/projects/proj_mustcle_1.png">
        <img id="img-hydro"   src="/projects/proj_hydrouqam.png">
        <img id="img-tower"   src="/projects/proj_tower_2.png">
    </a-assets>

    <a-marker preset="hiro" id="main-marker">

        <a-text value="Ange WU" position="0 0.2 -1.5"
                rotation="-75 0 0" align="center" color="white" width="5"></a-text>
        <a-text value="Développeur Full-Stack" position="0 0.2 -1.1"
                rotation="-75 0 0" align="center" color="#9C27B0" width="4"></a-text>

        <a-entity id="cards-container" visible="false" position="0 0.2 0.5"
                  animation="property: position; to: 0 0.3 0.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">

            <a-entity position="-14 0 0">
                <a-plane width="2.4" height="2.2" rotation="-75 0 0" color="#2d004a" opacity="0.95" material="shader: flat;"></a-plane>
                <a-image src="#img-crm" width="2.2" height="1.1" position="0 0.2 -0.45" rotation="-75 0 0"></a-image>
                <a-text value="CRM" position="0 0.05 0.3" rotation="-75 0 0" align="center" color="#CE93D8" width="6"></a-text>
                <a-text value="Gestion relation client" position="0 0.05 0.65" rotation="-75 0 0" align="center" color="#aaaaaa" width="4"></a-text>
            </a-entity>

            <a-entity position="-10.5 0 0">
                <a-plane width="2.4" height="2.2" rotation="-75 0 0" color="#2d004a" opacity="0.95" material="shader: flat;"></a-plane>
                <a-image src="#img-web4" width="2.2" height="1.1" position="0 0.2 -0.45" rotation="-75 0 0"></a-image>
                <a-text value="Web4Heroes" position="0 0.05 0.3" rotation="-75 0 0" align="center" color="#CE93D8" width="6"></a-text>
                <a-text value="Application web heroique" position="0 0.05 0.65" rotation="-75 0 0" align="center" color="#aaaaaa" width="4"></a-text>
            </a-entity>

            <a-entity position="-7 0 0">
                <a-plane width="2.4" height="2.2" rotation="-75 0 0" color="#2d004a" opacity="0.95" material="shader: flat;"></a-plane>
                <a-image src="#img-mustcle" width="2.2" height="1.1" position="0 0.2 -0.45" rotation="-75 0 0"></a-image>
                <a-text value="MUSTcle" position="0 0.05 0.3" rotation="-75 0 0" align="center" color="#CE93D8" width="6"></a-text>
                <a-text value="App fitness personnalisee" position="0 0.05 0.65" rotation="-75 0 0" align="center" color="#aaaaaa" width="4"></a-text>
            </a-entity>

            <a-entity position="-3.5 0 0">
                <a-plane width="2.4" height="2.2" rotation="-75 0 0" color="#2d004a" opacity="0.95" material="shader: flat;"></a-plane>
                <a-image src="#img-hydro" width="2.2" height="1.1" position="0 0.2 -0.45" rotation="-75 0 0"></a-image>
                <a-text value="Hydro UQAM" position="0 0.05 0.3" rotation="-75 0 0" align="center" color="#CE93D8" width="6"></a-text>
                <a-text value="Gestion hydraulique UQAM" position="0 0.05 0.65" rotation="-75 0 0" align="center" color="#aaaaaa" width="4"></a-text>
            </a-entity>

            <a-entity position="0 0 0">
                <a-plane width="2.4" height="2.2" rotation="-75 0 0" color="#2d004a" opacity="0.95" material="shader: flat;"></a-plane>
                <a-image src="#img-tower" width="2.2" height="1.1" position="0 0.2 -0.45" rotation="-75 0 0"></a-image>
                <a-text value="Tower Defense" position="0 0.05 0.3" rotation="-75 0 0" align="center" color="#CE93D8" width="6"></a-text>
                <a-text value="Jeu de strategie temps reel" position="0 0.05 0.65" rotation="-75 0 0" align="center" color="#aaaaaa" width="4"></a-text>
            </a-entity>

        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>
    const TOTAL_CARDS = 5;
    let currentCard = 0;
    let cardsVisible = false;
    let techOpen = false;

    const cardStartX = [-14, -10.5, -7, -3.5, 0];

    const cardData = [
        { github: 'https://github.com/NashieArtz/crm', tech: ['React', 'Node.js', 'MongoDB', 'Express'] },
        { github: 'https://github.com/NashieArtz/web4heroes', tech: ['Vue.js', 'Firebase', 'Tailwind'] },
        { github: '#', tech: ['React Native', 'Expo', 'TypeScript'] },
        { github: 'https://github.com/NashieArtz/hydrouqam', tech: ['Java', 'Spring Boot', 'PostgreSQL'] },
        { github: 'https://github.com/NashieArtz/tours-de-defense', tech: ['Unity', 'C#', 'ShaderGraph'] }
    ];

    function showCards() {
        cardsVisible = true;
        document.getElementById('cards-container').setAttribute('visible', 'true');
        document.getElementById('floating-btn').style.display = 'none';
        document.getElementById('btn-prev').style.display = 'block';
        document.getElementById('btn-next').style.display = 'block';
        document.getElementById('card-counter').style.display = 'block';
        document.getElementById('card-btns').classList.add('visible');
        updateCounter();
        goToCard(0);
    }

    function goToCard(index) {
        currentCard = index;
        techOpen = false;
        document.getElementById('tech-panel').style.display = 'none';
        const container = document.getElementById('cards-container');

        container.setAttribute('animation__slide', {
            property: 'position',
            to: `${-cardStartX[index]} 0.2 0.5`,
            dur: 500,
            easing: 'easeOutExpo'
        });

        updateCounter();
        updateBtns();
    }

    function nextCard() {
        if (currentCard < TOTAL_CARDS - 1) goToCard(currentCard + 1);
    }

    function prevCard() {
        if (currentCard > 0) goToCard(currentCard - 1);
    }

    function updateCounter() {
        document.getElementById('card-counter').textContent = `${currentCard + 1} / ${TOTAL_CARDS}`;
    }

    function updateBtns() {
        document.getElementById('btn-prev').style.opacity = currentCard === 0 ? '0.3' : '1';
        document.getElementById('btn-next').style.opacity = currentCard === TOTAL_CARDS - 1 ? '0.3' : '1';
    }

    function openGithub() {
        window.open(cardData[currentCard].github, '_blank');
    }

    function toggleTech() {
        if (techOpen) {
            closeTech();
        } else {
            const data = cardData[currentCard];
            document.getElementById('tech-tags').innerHTML =
                data.tech.map(t => `<span class="tag">${t}</span>`).join('');
            document.getElementById('tech-panel').style.display = 'block';
            techOpen = true;
        }
    }

    function closeTech() {
        document.getElementById('tech-panel').style.display = 'none';
        techOpen = false;
    }

    function hideAllUI() {
        document.getElementById('floating-btn').style.display = 'none';
        document.getElementById('btn-prev').style.display = 'none';
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('card-counter').style.display = 'none';
        document.getElementById('card-btns').classList.remove('visible');
        document.getElementById('tech-panel').style.display = 'none';
    }

    document.querySelector('a-scene').addEventListener('loaded', () => {
        document.querySelector('#main-marker').addEventListener('markerFound', () => {
            if (!cardsVisible) {
                document.getElementById('floating-btn').style.display = 'block';
            } else {
                document.getElementById('btn-prev').style.display = 'block';
                document.getElementById('btn-next').style.display = 'block';
                document.getElementById('card-counter').style.display = 'block';
                document.getElementById('card-btns').classList.add('visible');
            }
        });

        document.querySelector('#main-marker').addEventListener('markerLost', () => {
            hideAllUI();
        });
    });
</script>

</body>
</html>
